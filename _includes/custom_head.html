{% comment %}
  Placeholder to allow defining custom head. You can put favicons and other custom header fields here
{% endcomment %}

<style>
/* Tag Sidebar Styles */
.home-container {
  position: relative;
}

.home-main {
  /* 본문은 원래 너비 유지 */
}

.tag-sidebar {
  width: 200px;
  position: fixed;
  left: 1em;
  top: 2em;
  background-color: var(--bg-secondary);
  border-radius: 0.5em;
  padding: 0;
  overflow: hidden;
  transition: all 0.3s ease;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.tag-sidebar.collapsed .tag-sidebar-content {
  display: none;
}

.tag-sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.8em 1em;
  cursor: pointer;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--text-secondary);
  user-select: none;
}

.tag-sidebar-header:hover {
  background-color: var(--bg);
}

.tag-sidebar-title {
  font-weight: bold;
  color: var(--headings);
  font-size: 0.95em;
}

.tag-sidebar-toggle {
  color: var(--text-secondary);
  font-size: 0.8em;
  transition: transform 0.3s ease;
}

.tag-sidebar-content {
  padding: 0.5em 0;
}

.tag-group {
  margin: 0;
}

.tag-item {
  display: flex;
  align-items: center;
  padding: 0.5em 1em;
  cursor: pointer;
  transition: background-color 0.2s ease;
  user-select: none;
}

.tag-item:hover {
  background-color: var(--bg);
}

.tag-name {
  color: var(--links);
  font-size: 0.85em;
  font-weight: 500;
}

.tag-count {
  color: var(--text-secondary);
  font-size: 0.75em;
  margin-left: 0.5em;
}

.tag-arrow {
  margin-left: auto;
  color: var(--text-secondary);
  font-size: 0.8em;
  transition: transform 0.3s ease;
}

.tag-arrow.rotated {
  transform: rotate(90deg);
}

.tag-posts {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  background-color: var(--bg);
}

.tag-posts.expanded {
  max-height: 500px;
}

.tag-posts li {
  padding: 0.4em 1em 0.4em 1.5em;
  font-size: 0.8em;
  border-left: 2px solid var(--bg-secondary);
  margin: 0;
}

.tag-posts li:hover {
  border-left-color: var(--links);
}

.tag-posts a {
  color: var(--text);
  text-decoration: none;
  display: block;
  line-height: 1.4;
}

.tag-posts a:hover {
  color: var(--links);
}

.post-date-small {
  display: block;
  color: var(--text-secondary);
  font-size: 0.85em;
  font-family: "Roboto Mono", monospace;
}

/* Responsive Design */
@media screen and (max-width: 1200px) {
  .tag-sidebar {
    width: 180px;
    font-size: 0.9em;
  }
}

@media screen and (max-width: 900px) {
  .tag-sidebar {
    position: relative;
    width: 100%;
    left: auto;
    top: auto;
    margin-bottom: 1.5em;
    box-shadow: none;
  }
}

/* Intro Tags Styles */
.intro-tags {
  margin-top: 1em;
}

.tag-section {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5em;
  margin-bottom: 0.8em;
}

.tag-label {
  font-size: 0.8em;
  color: var(--text-secondary);
  margin-right: 0.3em;
}

.tag {
  display: inline-block;
  padding: 0.25em 0.7em;
  font-size: 0.8em;
  border-radius: 1em;
  background-color: var(--bg-secondary);
  color: var(--text);
  border: 1px solid transparent;
}

.tag.interest {
  border-color: var(--links);
  color: var(--links);
}

.tag.skill {
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  background-color: var(--bg-secondary);
  color: var(--text-secondary);
}

.skill-icon {
  width: 1em;
  height: 1em;
  object-fit: contain;
}

/* Site title style */
.site-title {
  font-size: 2em;
  background: linear-gradient(135deg, var(--links) 0%, var(--headings) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.3em;
}

/* Section header with more link */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.section-header h2 {
  margin-bottom: 0;
}

.more-link {
  font-size: 0.85em;
  color: var(--text-secondary);
  text-decoration: none;
}

.more-link:hover {
  color: var(--links);
}

/* Certification list */
.cert-list {
  list-style: none;
  padding: 0;
  margin: 0;
  margin-top: -0.5em;
}

.cert-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.6em 0;
  border-bottom: 1px solid var(--bg-secondary);
}

.cert-item:last-child {
  border-bottom: none;
}

.cert-name {
  font-weight: 500;
  color: var(--text);
}

.cert-meta {
  font-size: 0.8em;
  color: var(--text-secondary);
}

/* Back home link style */
a[href="/"], a[href="./"] {
  display: inline-block;
  font-size: 0.9em;
  color: var(--text-secondary);
  text-decoration: none;
  margin-bottom: 1em;
}

a[href="/"]:hover, a[href="./"]:hover {
  color: var(--links);
}

/* Tag filter styles */
.tag-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5em;
  margin-bottom: 1.5em;
}

.tag-filter-btn {
  padding: 0.4em 0.8em;
  font-size: 0.85em;
  border: 1px solid var(--text-secondary);
  border-radius: 1em;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.tag-filter-btn:hover {
  border-color: var(--links);
  color: var(--links);
}

.tag-filter-btn.active {
  background: var(--links);
  border-color: var(--links);
  color: var(--bg);
}

.blog-post-list {
  list-style: none;
  padding: 0;
}

.post-tags {
  margin-left: 0.5em;
}

.post-tag {
  font-size: 0.75em;
  padding: 0.2em 0.5em;
  background: var(--bg-secondary);
  border-radius: 0.3em;
  color: var(--text-secondary);
  margin-left: 0.3em;
}
</style>
